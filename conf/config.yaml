hydra:
  run:
    dir: ./${save_dir}/${name}/hydra_ouput/${now:%Y-%m-%d_%H-%M-%S}
defaults:
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

gpu: "cuda:0"
decay_rate: 1e-3
save_dir: "runs"
name: None
resume: False
checkpoint_path: None

batch_size: 64
lr: 8e-4
total_epoch: 6
emb_dim: 512
proj_dim: 512
num_heads: 4
N_p: 64
N_raw: 42355
droprate: 0.1
attention_dim: 512
weight: 0.7

data:
  info_root: /cpfs01/shared/optimal/zhangpingrui/nav_data/kitchen/bestman_trials
  rgbd_root: /cpfs01/shared/optimal/zhangpingrui/nav_data/kitchen/RGBD

